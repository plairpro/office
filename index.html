<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Офисная ярость</title>
    <meta name="description" content="Быстрый PvP на 2–4 коллег прямо в браузере. Степлеры, швабры, кулер." />
    <meta property="og:title" content="Офисная ярость — тебя вызывают на разборку" />
    <meta property="og:description" content="Быстрый PvP на 2–4 коллег прямо в браузере. Без регистрации — просто открой ссылку." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1d2129" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📎</text></svg>" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="heal-flash"></div>

    <!-- Меню -->
    <div id="menu" class="overlay">
      <div class="card">
        <div class="logo">ОФИСНАЯ<br /><span>ЯРОСТЬ</span></div>
        <p class="tagline" id="menu-tagline">Быстрый PvP на 2–4 коллег. Зайди, позови друзей по ссылке — а пока бей манекенов.</p>
        <label class="field">
          <span>Как тебя зовут в офисе?</span>
          <input id="name" maxlength="16" autocomplete="nickname" placeholder="Например, Бухгалтер Света" />
        </label>
        <div class="field"><span>Кем будешь драться?</span></div>
        <div id="chars" class="chars"></div>
        <button id="btn-main" class="btn cta">Войти в офис</button>
        <p id="menu-error" class="error" hidden></p>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" hidden>
      <div class="panel room">
        <div class="room-code">Комната <b id="room-code">—</b></div>
        <ul id="roster"></ul>
        <div id="net-status" class="status"></div>
      </div>
      <button id="btn-invite" class="btn primary invite">📨 Позвать коллег</button>
      <div class="panel me-panel">
        <div class="hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
        <div class="weapon"><b id="weapon-name"></b> <span id="ammo"></span></div>
        <div id="effects" class="effects"></div>
      </div>
      <ul id="feed"></ul>
      <div id="death" hidden><b>УВОЛЕН</b><span id="death-sub"></span></div>
      <div id="win" hidden><div class="win-card"><small>Сотрудник месяца</small><b id="win-name"></b><span id="win-sub"></span><small>Новый раунд через несколько секунд</small></div></div>
      <div class="panel fps"><span id="fps"></span>
        <button id="btn-mute" class="mute" title="Звук">🔊</button>
        <select id="gore" title="Кровь">
          <option value="on">Кровь</option>
          <option value="off">Конфетти</option>
        </select>
        <select id="quality" title="Графика">
          <option value="low">Низкая</option>
          <option value="medium">Средняя</option>
          <option value="high">Высокая</option>
        </select>
      </div>
      <div class="hint">WASD — бег · мышь — прицел · ЛКМ или пробел — удар · подбирай оружие и кофе с пола</div>
      <button id="btn-attack" hidden aria-label="Удар">✊</button>
    </div>

    <div id="stick" hidden><div id="stick-knob"></div></div>
    <div id="toast" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
